<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bank Desk — Overnight Clearing · peachyhabanero</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="overnight.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    .closed-banner { background: rgba(255, 107, 107, 0.15); border: 1px solid #ff6b6b; color: #ffb3b3; border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-weight: 600; text-align: center; }
    .countdown { font-family: "IBM Plex Mono", monospace; font-size: 22px; color: var(--lime); min-width: 70px; }
    .countdown.urgent { color: #ff6b6b; }
    .history-list { list-style: none; padding: 0; margin: 8px 0; font-family: "IBM Plex Mono", monospace; }
    .history-list li { padding: 4px 0; border-bottom: 1px solid var(--gold-faint); }
    .msg.warn { color: #ffe2a8; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <p class="navline">
        <a href="overnight-clearing-v2.html">← main desk</a>
      </p>
    </div>
    <h1 id="title">Bank Desk</h1>
    <p class="sub">Your balance sheet and order entry for this session.</p>
  </header>

  <div class="bank-wrap">
    <div id="content">
      <div id="status" class="status-bar">Connecting…</div>

      <div class="stat-row">
        <div class="stat-box"><div class="label">Day</div><div class="value" id="day">1</div></div>
        <div class="stat-box"><div class="label">SOFR</div><div class="value" id="sofr">—</div></div>
        <div class="stat-box"><div class="label">Phase</div><div class="value" id="phase">trading</div></div>
        <div class="stat-box"><div class="label">Corridor</div><div class="value" id="corridor" style="font-size:14px">—</div></div>
        <div class="stat-box"><div class="label">Time left</div><div class="value countdown" id="countdown">—</div></div>
      </div>

      <div id="closed-banner" class="closed-banner" style="display:none">Market closed</div>

      <div class="two-col">
        <div class="panel">
          <h3>Balance Sheet</h3>
          <div id="bs"></div>
        </div>
        <div class="panel order-form">
          <h3>Post Order</h3>
          <div class="row"><label>Side</label>
            <select id="side" class="field"><option value="bid">Bid (borrow cash)</option><option value="offer">Offer (lend cash)</option></select>
          </div>
          <div class="row"><label>Rate %</label><input id="rate" class="field" type="number" step="0.01" value="4.40"></div>
          <div class="row"><label>Volume $B</label><input id="vol" class="field" type="number" step="0.1" value="1.0"></div>
          <button class="neon-btn" id="submit">Submit Order</button>
          <div id="warn" class="msg"></div>
          <div id="msg" class="msg"></div>
          <div id="book" style="margin-top:16px"></div>
        </div>
      </div>
    </div>
    <div id="ended" class="ended" style="display:none">Session ended by host.</div>
  </div>

  <script type="module">
    import * as E from "./overnight-engine.js";
    import * as UI from "./overnight-ui.js";
    import { db, ref, onValue, update, push, configError, explainError } from "./overnight-db.js";

    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session");
    const stub = params.get("stub");
    const statusEl = document.getElementById("status");
    const msgEl = document.getElementById("msg");

    if (configError) { statusEl.textContent = configError; statusEl.className = "status-bar err"; throw new Error(configError); }
    if (!sessionId || !stub) { document.body.innerHTML = "<h1>Missing session or stub. Use the private link from the instructor.</h1>"; throw new Error("missing params"); }

    let state = null;
    const sessRef = ref(db, "sessions/" + sessionId);

    function formatRemaining(rem) {
      const m = Math.floor(rem / 60000);
      const s = Math.floor((rem % 60000) / 1000);
      return m + ":" + String(s).padStart(2, "0");
    }

    function updateCountdown() {
      const el = document.getElementById("countdown");
      if (!el || !state) return;
      if (state.phase === "closed") { el.textContent = "closed"; el.className = "value countdown"; return; }
      if (state.timerPaused) {
        const rem = Math.max(0, state.timerRemainingMs || 0);
        el.textContent = formatRemaining(rem) + " paused";
        el.className = "value countdown";
        return;
      }
      if (!state.timerEnd) { el.textContent = "—"; el.className = "value countdown"; return; }
      const rem = state.timerEnd - Date.now();
      if (rem <= 0) { el.textContent = "0:00"; el.className = "value countdown urgent"; return; }
      el.textContent = formatRemaining(rem);
      el.className = rem < 30000 ? "value countdown urgent" : "value countdown";
    }

    function updateWarn() {
      const wEl = document.getElementById("warn");
      if (!wEl || !state) return;
      const side = document.getElementById("side").value;
      const rate = parseFloat(document.getElementById("rate").value);
      const warn = isFinite(rate) ? E.corridorWarning(state, side, rate) : null;
      wEl.textContent = warn ? "⚠ " + warn : "";
      wEl.className = warn ? "msg warn" : "msg";
    }

    onValue(sessRef, (snap) => {
      if (!snap.exists()) {
        document.getElementById("content").style.display = "none";
        document.getElementById("ended").style.display = "block";
        return;
      }
      state = E.normalize(snap.val());
      const bank = state.banks[stub];
      if (!bank) {
        document.getElementById("bs").innerHTML = "<p class='muted'>Waiting for bank…</p>";
        return;
      }
      document.getElementById("title").textContent = bank.name;
      document.getElementById("day").textContent = state.day;
      document.getElementById("sofr").textContent = state.sofr != null ? state.sofr.toFixed(2) + "%" : "—";
      document.getElementById("phase").textContent = state.phase;
      document.getElementById("corridor").textContent = `IORB ${state.rates.iorb.toFixed(2)} / SRF ${state.rates.srf.toFixed(2)}`;
      document.getElementById("bs").innerHTML = UI.balanceSheetHTML(state, stub);
      document.getElementById("book").innerHTML = UI.orderBookHTML(state, { highlightStub: stub });

      const closedEl = document.getElementById("closed-banner");
      const formDisabled = state.phase !== "trading";
      if (formDisabled) {
        closedEl.style.display = "block";
        closedEl.textContent = state.closedBy === "timer" ? "Market closed — time’s up" : "Market closed";
      } else {
        closedEl.style.display = "none";
      }
      document.getElementById("submit").disabled = formDisabled;
      document.getElementById("side").disabled = formDisabled;
      document.getElementById("rate").disabled = formDisabled;
      document.getElementById("vol").disabled = formDisabled;

      updateCountdown();
      updateWarn();
      statusEl.textContent = "Connected to session " + sessionId;
      statusEl.className = "status-bar";
    }, (err) => { statusEl.textContent = explainError(err); statusEl.className = "status-bar err"; });

    setInterval(updateCountdown, 250);
    document.getElementById("rate").addEventListener("input", updateWarn);
    document.getElementById("side").addEventListener("change", updateWarn);

    document.getElementById("submit").onclick = async () => {
      if (!state) return;
      const side = document.getElementById("side").value;
      const rate = parseFloat(document.getElementById("rate").value);
      const volume = parseFloat(document.getElementById("vol").value);
      const err = E.validateOrder(state, stub, side, rate, volume);
      if (err) { msgEl.textContent = err; msgEl.className = "msg err"; return; }
      const warn = E.corridorWarning(state, side, rate);
      if (warn && !confirm(warn + "\n\nSubmit anyway?")) return;

      const order = {
        stub, name: state.banks[stub].name, side, rate, volume,
        remaining: volume, filled: 0, status: "open", day: state.day, ts: Date.now()
      };
      const orderId = push(ref(db, "sessions/" + sessionId + "/orders")).key;
      await update(ref(db, "sessions/" + sessionId + "/orders/" + orderId), order);

      // Host does the matching; we just write the order.
      msgEl.textContent = "Order submitted.";
      msgEl.className = "msg ok";
    };
  </script>
</body>
</html>

name: pages

# HTML/JS/CSS only. No FRED. Last published JSON comes from the
# cube-published cache (written only after a green nightly) or, if
# that cache is cold, from the live site. A failed nightly never
# reaches deploy-pages, so GitHub keeps the previous Pages build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
      - "scripts/build_site_data.py"
      - ".github/workflows/nightly-data.yml"
      - "src/cube_data.py"
      - "src/cube_visualize.py"
      - "src/failure_cube.py"
      - "src/cube_critical_values.csv"
      - "site/data/cube_critical_values.csv"
      - "site/data/zone.csv"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: iso week
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: restore published json
        uses: actions/cache/restore@v4
        with:
          path: site/data/published
          key: cube-published-v2-${{ github.ref_name }}-${{ steps.week.outputs.iso }}
          restore-keys: |
            cube-published-v2-${{ github.ref_name }}-
            cube-published-v2-
            cube-published-

      - name: require published json from cache
        run: |
          test -s site/data/published/cubes.json || {
            echo "missing site/data/published/cubes.json — run nightly-data first"
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

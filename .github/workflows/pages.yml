name: pages

# HTML/JS/CSS only. No FRED. Last published JSON comes from the
# cube-published cache (written only after a green nightly).
# Mixed commits (pipeline + HTML) are owned by nightly-data, which
# already deploys the whole site/. This workflow must not also call
# deploy-pages or GitHub cancels nightly ("higher priority pages request").
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-html
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      html_only: ${{ steps.gate.outputs.html_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "html_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1"
          else
            RANGE="$BEFORE"
          fi
          CHANGED=$(git diff --name-only "$RANGE" "$GITHUB_SHA" || git diff --name-only HEAD~1)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(scripts/|src/|requirements.txt|site/data/zone.csv|site/data/cube_critical_values.csv|\.github/workflows/nightly-data.yml)'; then
            echo "pipeline files in this push — nightly-data deploys"
            echo "html_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "html_only=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.html_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: iso week
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: restore published json
        uses: actions/cache/restore@v4
        with:
          path: site/data/published
          key: cube-published-v2-${{ github.ref_name }}-${{ steps.week.outputs.iso }}
          restore-keys: |
            cube-published-v2-${{ github.ref_name }}-
            cube-published-v2-
            cube-published-

      - name: require published json from cache
        run: |
          test -s site/data/published/cubes.json || {
            echo "missing site/data/published/cubes.json — run nightly-data first"
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

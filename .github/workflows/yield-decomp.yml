name: Update yield decomposition

on:
  schedule:
    - cron: "0 12 * * 1-5"   # weekdays 12:00 UTC
  push:
    paths:
      - "scripts/update-yield-decomp.py"
      - ".github/workflows/yield-decomp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run updater
        run: |
          mkdir -p site/data
          python scripts/update-yield-decomp.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/yield-decomp.json site/yield-decomposition.html || true
          git diff --staged --quiet || git commit -m "chore: refresh yield-decomposition data"

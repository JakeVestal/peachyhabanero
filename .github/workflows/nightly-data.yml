name: nightly-data

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Ignore cache and rebuild raw frames from 1970"
        type: boolean
        default: false
  # A push that touches the pipeline retriggers this job (not HTML-only pushes).
  push:
    branches: [main]
    paths:
      - "scripts/build_site_data.py"
      - ".github/workflows/nightly-data.yml"
      - "src/cube_data.py"
      - "src/cube_visualize.py"
      - "src/failure_cube.py"
      - "src/cube_critical_values.csv"
      - "site/data/cube_critical_values.csv"
      - "site/data/zone.csv"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: iso week
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: restore raw-frame cache
        if: ${{ github.event.inputs.full_rebuild != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: cube-raw-v2-${{ github.ref_name }}-${{ steps.week.outputs.iso }}
          restore-keys: |
            cube-raw-v2-${{ github.ref_name }}-
            cube-raw-v2-
            cube-raw-

      - name: build published json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CUBE_CACHE: ${{ github.workspace }}/.cache
          CUBE_DATA_DIR: ${{ github.workspace }}/site/data
          CUBE_FULL_REBUILD: ${{ github.event.inputs.full_rebuild }}
        run: python scripts/build_site_data.py

      - name: save raw-frame cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: cube-raw-v2-${{ github.ref_name }}-${{ steps.week.outputs.iso }}

      - name: require published json
        run: |
          test -s site/data/published/cubes.json
          test -s site/data/published/quarterly.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("site/data/published/cubes.json")
          pack = json.loads(p.read_text())
          assert pack.get("sustain") and pack.get("fail"), "empty cubes"
          print("ok", pack.get("coupon_source"), "sustain", len(pack["sustain"]))
          PY

      - name: save published json cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/data/published
          key: cube-published-v2-${{ github.ref_name }}-${{ steps.week.outputs.iso }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
